name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4' ]
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, simplexml
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Coding standards
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Tests
        run: composer test
